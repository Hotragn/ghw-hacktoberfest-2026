# Local stack. For Tiger Cloud: remove `db`, point TIGER_DB_URL at your service (see DEPLOY.md).
x-env: &env
  TIGER_DB_URL: postgres://postgres:${POSTGRES_PASSWORD:-localdev}@db:5432/tsdb
  TOOLTRUTH_API_KEY: ${TOOLTRUTH_API_KEY:-}
  TOOLTRUTH_ENV: ${TOOLTRUTH_ENV:-dev}
services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-localdev}", POSTGRES_DB: tsdb }
    ports: ["5434:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d tsdb"], interval: 5s, retries: 20 }
  migrate:
    build: .
    command: ["python", "-m", "tooltruth.setup_db"]
    environment: *env
    depends_on: { db: { condition: service_healthy } }
  backfill:
    build: .
    profiles: ["demo"]
    command: ["sh", "-c", "python -m tooltruth.simulator --backfill-hours 48 && python -m tooltruth.fingerprint --windows 48"]
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully } }
  live:
    build: .
    profiles: ["live"]
    command: ["python", "-m", "tooltruth.simulator", "--live", "--rate", "20"]
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully } }
  fingerprint:
    build: .
    profiles: ["live"]
    command: ["python", "-m", "tooltruth.fingerprint", "--loop", "300"]
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully } }
  api:
    build: .
    ports: ["8101:8101"]
    environment: *env
    read_only: true
    security_opt: ["no-new-privileges:true"]
    depends_on: { migrate: { condition: service_completed_successfully } }
